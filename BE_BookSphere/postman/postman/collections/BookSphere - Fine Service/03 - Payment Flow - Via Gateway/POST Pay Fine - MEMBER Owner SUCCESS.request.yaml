$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}/pay"
method: POST
headers:
  Authorization: Bearer {{accessTokenMemberOwner}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "paymentMethod": "E_WALLET",
      "paymentStatus": "SUCCESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Payment SUCCESS', function () { pm.expect(pm.response.json().data.paymentStatus).to.eql('SUCCESS'); });
      pm.test('Payment method E_WALLET', function () { pm.expect(pm.response.json().data.paymentMethod).to.eql('E_WALLET'); });
    language: text/javascript
order: 6000
