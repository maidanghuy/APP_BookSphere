$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}/pay"
method: POST
headers:
  Authorization: Bearer {{accessTokenAdmin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "paymentMethod": "INVALID",
      "paymentStatus": "SUCCESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', function () { pm.response.to.have.status(400); });
      pm.test('Error code VALIDATION_FAILED', function () { pm.expect(pm.response.json().errors[0].code).to.eql('VALIDATION_FAILED'); });
    language: text/javascript
order: 4000
