$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}/pay"
method: POST
headers:
  Authorization: Bearer {{accessTokenAdmin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "paymentMethod": "CASH",
      "paymentStatus": "SUCCESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 422', function () { pm.response.to.have.status(422); });
      pm.test('Error code FINE_ALREADY_PAID', function () { pm.expect(pm.response.json().errors[0].code).to.eql('FINE_ALREADY_PAID'); });
    language: text/javascript
order: 8000
