$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}/pay"
method: POST
headers:
  Authorization: Bearer {{accessTokenAdmin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "paymentMethod": "CASH",
      "paymentStatus": "FAILED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Payment status FAILED', function () { pm.expect(pm.response.json().data.paymentStatus).to.eql('FAILED'); });
    language: text/javascript
order: 1000
