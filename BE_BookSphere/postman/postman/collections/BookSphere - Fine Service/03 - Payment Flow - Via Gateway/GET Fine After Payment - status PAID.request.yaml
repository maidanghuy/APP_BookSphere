$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}"
method: GET
headers:
  Authorization: Bearer {{accessTokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Fine status PAID', function () { pm.expect(pm.response.json().data.status).to.eql('PAID'); });
      pm.test('paidAt is set', function () { pm.expect(pm.response.json().data.paidAt).to.not.be.null; });
    language: text/javascript
order: 7000
