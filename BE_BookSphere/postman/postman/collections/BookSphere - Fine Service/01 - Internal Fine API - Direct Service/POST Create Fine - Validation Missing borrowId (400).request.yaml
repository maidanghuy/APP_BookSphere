$kind: http-request
url: "{{fineServiceBaseUrl}}/internal/fines"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": 4,
      "createdFrom": "LATE_RETURN"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', function () { pm.response.to.have.status(400); });
      pm.test('success is false', function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 2000
