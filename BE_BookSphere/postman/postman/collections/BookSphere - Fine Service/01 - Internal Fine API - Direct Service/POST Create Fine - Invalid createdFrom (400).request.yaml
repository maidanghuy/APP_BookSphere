$kind: http-request
url: "{{fineServiceBaseUrl}}/internal/fines"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "borrowId": 2,
      "userId": 4,
      "createdFrom": "INVALID_SOURCE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', function () { pm.response.to.have.status(400); });
      pm.test('Error code VALIDATION_FAILED', function () { pm.expect(pm.response.json().errors[0].code).to.eql('VALIDATION_FAILED'); });
    language: text/javascript
order: 3000
