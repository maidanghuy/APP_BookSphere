$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines?userId={{seedFineUserId}}&page=0&size=10"
method: GET
headers:
  Authorization: Bearer {{accessTokenAdmin}}
queryParams:
  userId: "{{seedFineUserId}}"
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('All items belong to user', function () { pm.response.json().data.content.forEach(function (f) { pm.expect(f.userId).to.eql(parseInt(pm.environment.get('seedFineUserId'))); }); });
    language: text/javascript
order: 3000
