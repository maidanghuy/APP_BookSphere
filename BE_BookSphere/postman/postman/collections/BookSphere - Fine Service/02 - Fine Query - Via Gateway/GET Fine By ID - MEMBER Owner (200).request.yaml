$kind: http-request
url: "{{gatewayBaseUrl}}/api/fines/{{fineId}}"
method: GET
headers:
  Authorization: Bearer {{accessTokenMemberOwner}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Owner userId matches', function () { pm.expect(pm.response.json().data.userId).to.eql(parseInt(pm.environment.get('seedFineUserId'))); });
    language: text/javascript
order: 9000
