server:
  port: 8084

spring:
  application:
    name: fine-service
  datasource:
    url: ${FINE_DB_URL:jdbc:mysql://localhost:3306/DBFine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:booksphere}
    password: ${MYSQL_PASSWORD:booksphere123}
    driver-class-name: com.mysql.cj.jdbc.Driver

booksphere:
  fine:
    amount-per-day: ${FINE_AMOUNT_PER_DAY:5000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
