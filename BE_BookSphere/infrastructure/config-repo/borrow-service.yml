server:
  port: 8083

spring:
  application:
    name: borrow-service
  datasource:
    url: ${BORROW_DB_URL:jdbc:mysql://localhost:3306/DBBorrow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:booksphere}
    password: ${MYSQL_PASSWORD:booksphere123}
    driver-class-name: com.mysql.cj.jdbc.Driver

booksphere:
  borrow:
    overdue-scheduler:
      enabled: ${BORROW_OVERDUE_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${BORROW_OVERDUE_SCHEDULER_FIXED_DELAY_MS:60000}
    due-soon:
      enabled: ${BORROW_DUE_SOON_ENABLED:true}
      window-hours: ${BORROW_DUE_SOON_WINDOW_HOURS:24}
      fixed-delay-ms: ${BORROW_DUE_SOON_FIXED_DELAY_MS:300000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
